<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="/js/ebk-loader.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1c" />
  <meta name="description" content="Player Grid (MLB) — name a player for every team/stat intersection." />
  <title>MLB · Player Grid · EBK</title>
  <link rel="canonical" href="https://eliteballknowledge.web.app/mlb/player-grid" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="EBK — Elite Ball Knowledge" />
  <meta property="og:title" content="MLB · Player Grid · EBK" />
  <meta property="og:description" content="Player Grid (MLB) — name a player for every team/stat intersection." />
  <meta property="og:url" content="https://eliteballknowledge.web.app/mlb/player-grid" />
  <meta property="og:image" content="https://eliteballknowledge.web.app/img/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="EBK — Elite Ball Knowledge. Prove it." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="MLB · Player Grid · EBK" />
  <meta name="twitter:description" content="Player Grid (MLB) — name a player for every team/stat intersection." />
  <meta name="twitter:image" content="https://eliteballknowledge.web.app/img/og.png" />
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  <link rel="preconnect" href="https://a.espncdn.com" crossorigin />
  <link rel="icon" type="image/svg+xml" href="/img/icon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="32x32" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/ebk-kit.css" />
  <script src="/js/ebk-kit.js"></script>
  <link rel="stylesheet" href="/css/game-common.css" />
  <script src="/js/ebk-analytics.js" defer></script>
</head>
<body data-sport="mlb">
  <div class="gpage">
    <header class="gtop">
      <a class="gbrand" href="/" aria-label="EBK home"><span class="wordmark" aria-hidden="true">E<span>B</span>K</span></a>
      <a class="ghome" href="/mlb">&larr; <b>MLB</b></a>
      <div class="gname"><span class="k-kick">MLB <i>Daily grid</i></span><h1 class="gtitle">Player Grid</h1></div>
      <div class="gscore" role="group" aria-label="Scoreboard">
        <div class="chip"><span class="k">Filled</span><span class="v y" id="score" data-seg="00" data-seg-label="0">0</span></div>
        <div class="chip"><span class="k">Best</span><span class="v" id="best" data-seg="00" data-seg-label="0">0</span></div>
      </div>
    </header>
    <main class="gwrap">
      <p id="loading" class="muted center" role="status" aria-live="polite">Loading…</p>
      <div id="game" hidden class="grid-shell">
        <p class="center muted" id="status-line">Tap a square and name a player who fits both labels. One guess per square.</p>
        <div class="grid-panel"><div class="grid3" id="grid"></div></div>
        <div class="banner" id="banner"></div>
        <div class="row-btns" id="end-row" hidden></div>
        <p class="center muted grid-foot">Eligible if the player ever met that mark in a single season, or played for that team (2000–2026).</p>
      </div>
    </main>
  </div>
  <div class="modal-back" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <span class="k-kick">Your pick <i>One guess per square</i></span>
      <h3 id="m-title">Name a player</h3>
      <p class="modal-sub" id="m-sub"></p>
      <div class="ac-wrap">
        <input class="ac-input" id="ac" placeholder="Type a player name" aria-label="Player name" autocomplete="off"
               autocapitalize="off" autocorrect="off" spellcheck="false" />
        <div class="ac-list" id="ac-list" hidden></div>
      </div>
      <p class="modal-sub" id="m-msg" style="color:var(--lower);min-height:1.2em;margin-top:8px"></p>
      <div class="row-btns" style="margin-top:var(--sp-sm)">
        <button class="gbtn ghost" id="m-cancel">Cancel</button>
      </div>
    </div>
  </div>
  <script src="/js/mlb-teams.js"></script>
  <script src="/js/ebk-daily.js"></script>
  <script src="/js/player-grid.js"></script>
  <script src="/js/ebk-sound.js"></script>
</body>
</html>
