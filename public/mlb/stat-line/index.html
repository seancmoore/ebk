<body data-sport="mlb">
  <div class="gpage">
    <header class="gtop">
      <a class="gbrand" href="/" aria-label="EBK home"><span class="wordmark" aria-hidden="true">E<span>B</span>K</span></a>
      <a class="ghome" href="/mlb">&larr; <b>MLB</b></a>
      <div class="gname"><span class="k-kick">MLB <i>Name the player</i></span><h1 class="gtitle">Guess the Stat&nbsp;Line</h1></div>
      <div class="gscore" role="group" aria-label="Scoreboard">
        <div class="chip"><span class="k">Score</span><span class="v y" id="score" data-seg="00" data-seg-label="0">0</span></div>
        <div class="chip"><span class="k">Best</span><span class="v" id="best" data-seg="00" data-seg-label="0">0</span></div>
      </div>
    </header>
    <main class="gwrap">
      <p class="muted center gonboard">Mystery season, real numbers. Read the stat line, then pick the player who posted it.</p>
      <p id="loading" class="muted center" role="status" aria-live="polite">Loading…</p>
      <div id="game" hidden>
        <div class="gcard sl-card">
          <div class="sl-head">
            <div class="sl-who">
              <span class="k-kick">Mystery season <i>7s shot clock</i></span>
              <h2 class="sl-pos" id="pos-line">Player</h2>
              <div class="sl-team" id="team-line"></div>
            </div>
            <div class="sl-season"><span class="k-lbl">Season</span><span class="season-badge" id="season-badge">????</span></div>
          </div>
          <div class="statline" id="statline"></div>
          <div class="sl-tools" id="lifelines">
            <button class="gbtn ghost" id="reveal-exact">Reveal exact season</button>
          </div>
        </div>
        <div class="opt-list" id="options"></div>
        <div class="banner" id="banner"></div>
        <div class="player-reveal" id="reveal" hidden></div>
        <div class="row-btns" id="next-row" hidden></div>
      </div>
    </main>
  </div>
