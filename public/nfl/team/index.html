<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="/js/ebk-loader.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1c" />
  <meta name="description" content="Team study — browse, filter and sort every player-season for an NFL team. EBK." />
  <title>Team Study · EBK</title>
  <link rel="canonical" href="https://eliteballknowledge.web.app/nfl/team" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="EBK — Elite Ball Knowledge" />
  <meta property="og:title" content="Team Study · EBK" />
  <meta property="og:description" content="Team study — browse, filter and sort every player-season for an NFL team. EBK." />
  <meta property="og:url" content="https://eliteballknowledge.web.app/nfl/team" />
  <meta property="og:image" content="https://eliteballknowledge.web.app/img/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="EBK — Elite Ball Knowledge. Prove it." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Team Study · EBK" />
  <meta name="twitter:description" content="Team study — browse, filter and sort every player-season for an NFL team. EBK." />
  <meta name="twitter:image" content="https://eliteballknowledge.web.app/img/og.png" />
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  <link rel="preconnect" href="https://static.www.nfl.com" crossorigin />
  <link rel="icon" type="image/svg+xml" href="/img/icon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="32x32" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/ebk-kit.css" />
  <script src="/js/ebk-kit.js"></script>
  <link rel="stylesheet" href="/css/home.css" />
  <link rel="stylesheet" href="/css/team.css" />
  <script src="/js/ebk-analytics.js" defer></script>
</head>
<body data-sport="nfl">
  <header class="site-header">
    <a class="brand" href="/">
      <span class="wordmark" aria-label="EBK">E<span>B</span>K</span>
      <span class="brand-sub">Elite Ball Knowledge</span>
    </a>
    <a class="k-back ts-back" href="/nfl/teams">&larr; <b>NFL</b> <span>teams</span></a>
  </header>

  <main class="k-wrap ts-main">
    <p id="loading" class="ts-loading" role="status" aria-live="polite">Loading…</p>

    <div id="content" hidden>
      <section class="k-card panel ts-hero" id="team-head"></section>

      <div class="k-card deep ts-bar">
        <div class="ts-f ts-pos">
          <span class="ts-l" id="pos-l">Position</span>
          <div class="k-chips chip-row2" id="pos-chips" role="group" aria-labelledby="pos-l"></div>
        </div>
        <div class="ts-f ts-yrs">
          <span class="ts-l">Seasons</span>
          <span class="field"><select id="from" aria-label="From season"></select><i aria-hidden="true">to</i><select id="to" aria-label="To season"></select></span>
        </div>
        <label class="ts-f ts-q">
          <span class="ts-l">Search</span>
          <input class="search" id="search" type="search" placeholder="Search player…"
                 autocomplete="off" autocapitalize="off" spellcheck="false" />
        </label>
      </div>

      <div class="ts-head">
        <span class="k-kick">Player-seasons <i>Tap a column to sort</i></span>
        <p class="count" id="count" role="status"></p>
      </div>
      <div class="table-wrap k-tbl-wrap">
        <table class="tbl k-table"><thead id="thead"></thead><tbody id="tbody"></tbody></table>
      </div>
    </div>
  </main>

  <script src="/js/teams.js"></script>
  <script src="/js/team.js"></script>
  <script src="/js/ebk-sound.js"></script>
</body>
</html>
