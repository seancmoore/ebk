  <meta property="og:description" content="Pick a Premier League club to study — every player-season, filterable and sortable. EBK." />
  <meta property="og:url" content="https://eliteballknowledge.web.app/soccer/teams" />

  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/home.css" />
  <script src="/js/ebk-analytics.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="wordmark" aria-label="EBK">E<span>B</span>K</span>
      <span class="brand-sub">Elite Ball Knowledge</span>
    </a>
    <a class="header-tag" href="/soccer">← Soccer</a>
  </header>
  <main>
    <section class="hero wrap" style="padding-bottom: var(--sp-md)">
      <h1 class="rise">⚽ Club Study</h1>
      <p class="rise d1">Pick a club to browse, filter and sort every player-season in the EBK pool.</p>
    </section>
    <div class="wrap"><div class="team-grid" id="team-grid"></div></div>
  </main>
  <script src="/js/soccer-teams.js"></script>
  <script>
    (function () {
      var grid = document.getElementById("team-grid");
      if (!grid || !window.SOCCER) return;
      SOCCER.franchises.slice().sort(function (a, b) { return a.name.localeCompare(b.name); })
        .forEach(function (f) {
          var a = document.createElement("a");
          a.className = "team-tile";
          a.href = "/soccer/team?t=" + encodeURIComponent(f.key);
          a.innerHTML = '<img src="' + f.logo + '" alt="" loading="lazy" />' +
                        '<span>' + f.name + "</span>";
          grid.appendChild(a);
        });
    })();
  </script>
  <script src="/js/ebk-sound.js"></script>
</body>
</html>
